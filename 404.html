<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Page moved · Magic Masters Swimming</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="4; url=/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Old WordPress addresses (posts, portfolio pages, /wp-admin) land here and are sent home. */
:root { --canvas: #f3f8f8; --ink: #0b2340; --ink-2: #4b6275; --aqua: #20b9b3; --on-aqua: #04211f; --aqua-ink: #0c7a75; }
@media (prefers-color-scheme: dark) { :root { --canvas: #071a2b; --ink: #e8f2f4; --ink-2: #9db4c2; --aqua: #2fcfc7; --aqua-ink: #5ddbd4; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--ink);
  font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; padding: 24px max(20px, env(safe-area-inset-left, 0px)); }
main { max-width: 46rem; display: grid; gap: 20px; }
main p { max-width: 34rem; }
h1 { margin: 0; font-variation-settings: "wdth" 125; font-weight: 800; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; text-wrap: balance; }
p { margin: 0; color: var(--ink-2); line-height: 1.55; text-wrap: pretty; }
a.btn { justify-self: start; display: inline-flex; align-items: center; min-height: 46px; padding-inline: 22px; border-radius: 6px;
  background: var(--aqua); color: var(--on-aqua); font-weight: 650; text-decoration: none; }
a.btn:focus-visible { outline: 3px solid var(--aqua-ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>This page has&nbsp;moved.</h1>
  <p>The Magic Masters Swimming site has a new home. Squad times, private lessons and how to get in touch are all on one&nbsp;page.</p>
  <a class="btn" href="/">Go to the home page</a>
</main>
</body>
</html>
